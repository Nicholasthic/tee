name: Build tee times page

on:
  schedule:
    # 6am, 12pm, 6pm Brisbane (UTC+10, no daylight saving).
    - cron: "0 20,2,8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tee-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan and build page
        run: python build.py --days 7 --max-drive 45

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain docs/)" ]]; then
            git config user.name "tee-bot"
            git config user.email "actions@github.com"
            git add docs/
            git commit -m "tee times $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no change"
          fi
