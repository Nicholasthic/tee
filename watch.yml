name: Watch for four-balls

on:
  schedule:
    # Every 2 hours, 6am to 8pm Brisbane (UTC+10, no DST).
    - cron: "0 20,22,0,2,4,6,8,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teetime-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python scan.py --days 7 --players 4 --max-drive 45

      - name: Persist seen state
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "teetime-watch"
            git config user.email "actions@github.com"
            git add seen.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
