# teetime-watch club registry
#
# source: miclub   = the club's own MiClub timesheet (default if omitted)
#         teeitup  = the club's own Tee It Up site; needs alias + facility_id
#         golfnow  = GolfNow AU; needs facility_id. Prefer teeitup where both
#                    exist — same facility ids, far lighter, books direct.
#
# status: confirmed  = verified working by `python scan.py --discover`
#         candidate  = unverified guess
#         chronogolf = books via Chronogolf/Lightspeed; no adapter yet
#         unlisted   = no public online tee sheet found; phone only
#         closed     = course no longer operating; kept so it isn't re-added
#
# drive_min is approximate from Nerang/Robina.
# Set enabled: false on anything you'd never actually play.

clubs:
  # ---------- confirmed MiClub ----------
  - name: Palmer Gold Coast
    host: https://colonialrobina.miclub.com.au
    booking_resource_id: "3000001"
    drive_min: 10
    status: confirmed
    enabled: true

  - name: Palmer Colonial
    host: https://colonialrobina.miclub.com.au
    booking_resource_id: "3000000"
    drive_min: 10
    status: confirmed
