<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" style="color:#241C18" font-weight="800">
<!-- S&N Golf Co. · Sunburnt · Single screen
     Two inks: #241C18 / #241C18. Outline the type before printing. -->
