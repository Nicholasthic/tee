<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" style="color:#F3E8D5" font-weight="800">
<!-- S&N Golf Co. · Sunburnt · Back print with the line — 280mm
     Two inks: #F3E8D5 / #E8783C. Outline the type before printing. -->
<g transform="translate(-14 0) skewX(-13)">
      <g fill="#E8783C">
        <rect x="118" y="22" width="230" height="13" rx="6.5"/>
        <rect x="130" y="43" width="218" height="13" rx="6.5"/>
        <rect x="142" y="64" width="206" height="13" rx="6.5"/>
      </g>
      <text x="120" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="104" font-weight="800" letter-spacing="-6"
            fill="currentColor">S&amp;N</text>
    </g>
    <text x="220" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="800" letter-spacing="9.5"
          text-anchor="middle" fill="currentColor">GOLF CO.</text>
    <path d="M40 228H400" stroke="#E8783C" stroke-width="3" stroke-linecap="round"/>
    <text x="220" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="17" font-weight="800" letter-spacing="1.4"
          text-anchor="middle" fill="currentColor">BEERS · BOGEYS · BAD DECISIONS</text>
    <text x="220" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="11.5" font-weight="700" letter-spacing="5.5"
          text-anchor="middle" fill="currentColor" opacity=".6">GOLD COAST · EST 2026</text>
</svg>
